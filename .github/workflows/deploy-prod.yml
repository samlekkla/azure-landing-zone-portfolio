name: Deploy — Prod

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep what-if — network
        run: |
          az deployment sub what-if \
            --location swedencentral \
            --template-file infra/network/main.bicep \
            --parameters infra/network/prod.bicepparam

      - name: Bicep deploy — network
        run: |
          az deployment sub create \
            --location swedencentral \
            --template-file infra/network/main.bicep \
            --parameters infra/network/prod.bicepparam

      - name: Bicep what-if — security
        run: |
          az deployment sub what-if \
            --location swedencentral \
            --template-file infra/security/main.bicep \
            --parameters \
              ownerEmail='sam.lekkla@outlook.com' \
              homeIpAddress='${{ secrets.HOME_IP_ADDRESS }}'

      - name: Bicep deploy — security
        run: |
          az deployment sub create \
            --location swedencentral \
            --template-file infra/security/main.bicep \
            --parameters \
              ownerEmail='sam.lekkla@outlook.com' \
              homeIpAddress='${{ secrets.HOME_IP_ADDRESS }}'

      - name: Bicep what-if — data
        run: |
          az deployment sub what-if \
            --location swedencentral \
            --template-file infra/data/main.bicep \
            --parameters \
              ownerEmail='sam.lekkla@outlook.com' \
              homeIpAddress='${{ secrets.HOME_IP_ADDRESS }}' \
              azureAdAdminObjectId='${{ secrets.AZURE_AD_ADMIN_OBJECT_ID }}'

      - name: Bicep deploy — data
        run: |
          az deployment sub create \
            --location swedencentral \
            --template-file infra/data/main.bicep \
            --parameters \
              ownerEmail='sam.lekkla@outlook.com' \
              homeIpAddress='${{ secrets.HOME_IP_ADDRESS }}' \
              azureAdAdminObjectId='${{ secrets.AZURE_AD_ADMIN_OBJECT_ID }}'

      - name: Bicep what-if — compute
        run: |
          az deployment sub what-if \
            --location swedencentral \
            --template-file infra/compute/main.bicep \
            --parameters ownerEmail='sam.lekkla@outlook.com'

      - name: Bicep deploy — compute
        run: |
          az deployment sub create \
            --location swedencentral \
            --template-file infra/compute/main.bicep \
            --parameters ownerEmail='sam.lekkla@outlook.com'
