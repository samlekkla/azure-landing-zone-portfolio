name: Deploy — Dev

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep what-if — network
        run: |
          az deployment sub what-if \
            --location swedencentral \
            --template-file infra/network/main.bicep \
            --parameters infra/network/dev.bicepparam

      - name: Bicep deploy — network
        run: |
          az deployment sub create \
            --location swedencentral \
            --template-file infra/network/main.bicep \
            --parameters infra/network/dev.bicepparam
